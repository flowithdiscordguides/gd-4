# Defines the launcher-facing identity and repository-governed default behavior for this skill.
interface:
  display_name: "Three.js Game Director"
  short_description: "Route complete Three.js game work safely"
  default_prompt: >-
    Read ../SKILL.md, then select the smallest authorized repository-local supporting set. Delegate only to approved
    parent-scoped direct-child roles. Never execute, install, build, test, launch, browse, probe credentials, call
    providers, or access a network. Use user-supplied runtime evidence only, and report source-level limits honestly.
