# Defines the launcher-facing identity and repository-governed default behavior for this skill.
interface:
  display_name: "Three.js Animation"
  short_description: "Build clip, mixer, skeletal, morph, and GLTF animation"
  default_prompt: >-
    Read ../SKILL.md and ../references/animation-api-and-patterns.md. Use this skill for clip, mixer, skeletal, morph,
