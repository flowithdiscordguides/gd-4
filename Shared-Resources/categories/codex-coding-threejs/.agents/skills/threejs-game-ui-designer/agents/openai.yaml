# Defines the launcher-facing identity and repository-governed default behavior for this skill.
interface:
  display_name: "Three.js Game UI Designer"
  short_description: "Design expressive, accessible Three.js game UI"
  default_prompt: >-
    Read ../SKILL.md and its applicable repository-local references. Produce three distinct concepts with one
    non-obvious usable option, document selection rationale, and define a product-specific thesis and signature moment.
    Include accessibility, responsive fit, and reduced motion. Never execute, install, build, test, launch, browse,
    call providers, or access a network; distinguish source checks from user-supplied visual evidence.
